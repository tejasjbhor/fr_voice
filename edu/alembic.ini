# Alembic config — URL overridden at runtime from DATABASE_URL / DB_PATH

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder; core.database.run_migrations() and alembic/env.py set the real URL
sqlalchemy.url = sqlite:///./sathi_poc.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
