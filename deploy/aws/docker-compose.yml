# Run on the EC2 host (Mumbai): docker compose up -d --build
services:
  sathi:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: sathi
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - sathi_data:/app
    environment:
      PORT: "8000"
      PYTHONUNBUFFERED: "1"

volumes:
  sathi_data:
