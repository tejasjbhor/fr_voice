<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saathi — local call</title>
  <style>
    :root { --teal:#1F4E4A; --bg:#f4f1ea; --ink:#1a1a1a; --muted:#666; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
    h1 { font-size:1.25rem; color:var(--teal); margin:0 0 4px; }
    .sub { color:var(--muted); font-size:0.9rem; margin-bottom:16px; }
    .banner { background:#fff3cd; border:1px solid #e6d089; border-radius:10px; padding:10px 12px; font-size:0.85rem; margin-bottom:14px; }
    .chat { background:#fff; border-radius:14px; padding:12px; min-height:280px; max-height:50vh; overflow:auto; border:1px solid #ddd; }
    .bubble { margin:8px 0; padding:8px 12px; border-radius:12px; max-width:88%; font-size:0.95rem; line-height:1.4; }
    .bubble .who { display:block; font-size:0.7rem; text-transform:uppercase; opacity:0.55; margin-bottom:2px; }
    .ai { background:#e8f2f0; }
    .user { background:#f7e8d4; margin-left:auto; }
    .row { display:flex; gap:8px; margin-top:12px; }
    textarea { flex:1; min-height:64px; border-radius:10px; border:1px solid #ccc; padding:10px; font:inherit; resize:vertical; }
    button { border:0; border-radius:10px; padding:12px 16px; font-weight:600; cursor:pointer; }
    .send { background:var(--teal); color:#fff; }
    .end { background:#c44; color:#fff; width:100%; margin-top:10px; }
    button:disabled { opacity:0.5; cursor:wait; }
    .status { font-size:0.85rem; color:var(--muted); margin-top:8px; min-height:1.2em; }
    .ok { color:#1F4E4A; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Local dummy call</h1>
    <p class="sub" id="who">Loading…</p>
    <div class="banner">
      This is <b>not</b> Twilio. Type what the elder would say. When done, click
      <b>End call</b>, then in the Android app tap <b>Refresh last call</b>.
    </div>
    <div class="chat" id="chat"></div>
    <div class="row">
      <textarea id="msg" placeholder="Type as the elder… e.g. आज बरं वाटतंय"></textarea>
      <button class="send" type="button" id="send">Send</button>
    </div>
    <button class="end" type="button" id="end">End call</button>
    <p class="status" id="status"></p>
  </div>
  <script>
    const SID = "{{SESSION_ID}}";
    const chat = document.getElementById("chat");
    const statusEl = document.getElementById("status");
    const msg = document.getElementById("msg");
    let ended = false;

    function bubble(role, text) {
      if (!text) return;
      const d = document.createElement("div");
      d.className = "bubble " + (role === "user" ? "user" : "ai");
      d.innerHTML = '<span class="who">' + (role === "user" ? "Them" : "Saathi") + "</span>" +
        String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;");
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    function playAudio(b64) {
      if (!b64) return;
      const a = new Audio("data:audio/wav;base64," + b64);
      a.play().catch(() => {});
    }

    async function load() {
      const r = await fetch("/api/local-call/" + SID);
      const data = await r.json();
      if (!r.ok) { statusEl.textContent = data.error || "Not found"; return; }
      document.getElementById("who").textContent =
        (data.user && data.user.name ? data.user.name : "Elder") +
        " · " + (data.user && data.user.language || "") +
        " · " + (data.status || "");
      chat.innerHTML = "";
      (data.turns || []).forEach((t) => bubble(t.role === "user" ? "user" : "ai", t.message));
      if (data.status === "ended" || data.call_done) {
        ended = true;
        statusEl.textContent = "Call ended — refresh the app for transcript.";
        statusEl.className = "status ok";
        document.getElementById("send").disabled = true;
        document.getElementById("end").disabled = true;
      }
    }

    async function send() {
      if (ended) return;
      const text = msg.value.trim();
      if (!text) return;
      document.getElementById("send").disabled = true;
      statusEl.textContent = "Saathi is thinking…";
      bubble("user", text);
      msg.value = "";
      try {
        const r = await fetch("/api/local-call/" + SID + "/turn", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, speak: true }),
        });
        const data = await r.json();
        if (!r.ok) {
          statusEl.textContent = data.error || "Turn failed";
          document.getElementById("send").disabled = false;
          return;
        }
        bubble("ai", data.sathi_text || "");
        playAudio(data.audio_b64);
        if (data.call_done || data.status === "ended") {
          ended = true;
          statusEl.textContent = "Call ended — open the Android app → Refresh last call.";
          statusEl.className = "status ok";
          document.getElementById("end").disabled = true;
        } else {
          statusEl.textContent = "Your turn.";
          document.getElementById("send").disabled = false;
          msg.focus();
        }
      } catch (e) {
        statusEl.textContent = String(e.message || e);
        document.getElementById("send").disabled = false;
      }
    }

    async function endCall() {
      if (ended) return;
      document.getElementById("end").disabled = true;
      document.getElementById("send").disabled = true;
      statusEl.textContent = "Saving health notes…";
      try {
        const r = await fetch("/api/local-call/" + SID + "/end", { method: "POST" });
        const data = await r.json();
        ended = true;
        statusEl.textContent = "Saved. In the app: Refresh last call.";
        statusEl.className = "status ok";
        if (data.alert && data.alert.level) {
          statusEl.textContent += " Alert: " + data.alert.level;
        }
      } catch (e) {
        statusEl.textContent = String(e.message || e);
      }
    }

    document.getElementById("send").onclick = send;
    document.getElementById("end").onclick = endCall;
    msg.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    load();
  </script>
</body>
</html>
