<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1424" />
  <title>Saathi voice agent</title>
  <style>
    :root {
      --bg0: #0a1220;
      --bg1: #132238;
      --ink: #f0f4fa;
      --muted: #8fa3bc;
      --accent: #3b82f6;
      --accent-ink: #061018;
      --danger: #c45c4a;
      --line: rgba(240, 244, 250, 0.12);
      --ok: #60a5fa;
      --bad: #e08a7a;
      --card: rgba(255, 255, 255, 0.04);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 0% 0%, #1a3358 0%, transparent 55%),
        linear-gradient(165deg, var(--bg0), var(--bg1));
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    main {
      width: min(440px, 100%);
      margin: 0 auto;
      padding: 1.75rem 1.15rem 2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
    }
    h1 {
      font-size: clamp(1.7rem, 5.5vw, 2rem);
      font-weight: 650;
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }
    .lede {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      padding: 0.3rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(0,0,0,0.2);
    }
    .tabs button {
      border: 0;
      border-radius: 11px;
      padding: 0.7rem 0.5rem;
      font-size: 0.92rem;
      font-weight: 600;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .tabs button.active {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .panel {
      display: none;
      padding: 1.1rem;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      gap: 0.85rem;
    }
    .panel.active { display: grid; }
    label {
      display: grid;
      gap: 0.3rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.28);
      color: var(--ink);
      border-radius: 12px;
      padding: 0.85rem 0.95rem;
      font-size: 1.02rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      font-weight: 650;
      cursor: pointer;
    }
    .btn-call { background: var(--accent); color: var(--accent-ink); }
    .btn-end { background: var(--danger); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .btn-full { grid-column: 1 / -1; }
    .status { min-height: 1.35rem; font-size: 0.9rem; color: var(--muted); }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    .helpline-card {
      text-align: center;
      padding: 0.5rem 0 0.2rem;
    }
    .helpline-num {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0.6rem 0 1rem;
      word-break: break-all;
    }
    .helpline-num a { color: var(--ink); text-decoration: none; }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.72rem;
      padding: 0 1rem 1.1rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>Saathi voice agent</h1>
      <p class="lede">Call someone, or let them call Saathi voice agent.</p>
      <p id="serverStatus" class="lede" style="margin-top:0.55rem;font-size:0.85rem">Checking server…</p>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" class="active" id="tabOut" data-panel="out">Call someone</button>
      <button type="button" id="tabIn" data-panel="in">Call Saathi</button>
    </div>

    <form id="outPanel" class="panel active" autocomplete="on">
      <label>
        Name
        <input id="name" name="name" autocomplete="name" placeholder="Rohit" required />
      </label>
      <label>
        Phone (with country code)
        <input id="phone" name="phone" type="tel" inputmode="tel"
               autocomplete="tel" placeholder="+919876543210" required />
      </label>
      <label>
        Language
        <select id="language" name="language">
          <option value="hi-IN" selected>Hindi</option>
          <option value="mr-IN">Marathi</option>
          <option value="en-IN">English</option>
        </select>
      </label>
      <div class="actions">
        <button class="btn btn-call" id="callBtn" type="submit">Call</button>
        <button class="btn btn-end" id="endBtn" type="button" disabled>End call</button>
      </div>
      <p id="outStatus" class="status" aria-live="polite"></p>
    </form>

    <div id="inPanel" class="panel">
      <div class="helpline-card">
        <p class="lede">User dials this number on their phone. Saathi voice agent answers.</p>
        <p class="helpline-num" id="helplineNum">Loading…</p>
        <a class="btn btn-call btn-full" id="helplineLink" href="#" style="display:inline-block;text-align:center;text-decoration:none">Call Saathi voice agent</a>
      </div>
      <p id="inStatus" class="status" aria-live="polite"></p>
    </div>
  </main>
  <footer>Wake Free Render once, then place calls</footer>

  <script>
    const outPanel = document.getElementById("outPanel");
    const inPanel = document.getElementById("inPanel");
    const tabOut = document.getElementById("tabOut");
    const tabIn = document.getElementById("tabIn");
    const outStatus = document.getElementById("outStatus");
    const inStatus = document.getElementById("inStatus");
    const serverEl = document.getElementById("serverStatus");
    const callBtn = document.getElementById("callBtn");
    const endBtn = document.getElementById("endBtn");
    let activeCallSid = null;

    function setOut(msg, kind) {
      outStatus.textContent = msg;
      outStatus.className = "status" + (kind ? " " + kind : "");
    }
    function setIn(msg, kind) {
      inStatus.textContent = msg;
      inStatus.className = "status" + (kind ? " " + kind : "");
    }

    function showPanel(which) {
      const out = which === "out";
      outPanel.classList.toggle("active", out);
      inPanel.classList.toggle("active", !out);
      tabOut.classList.toggle("active", out);
      tabIn.classList.toggle("active", !out);
    }
    tabOut.addEventListener("click", () => showPanel("out"));
    tabIn.addEventListener("click", () => showPanel("in"));

    async function pingHealth(timeoutMs) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), timeoutMs || 90000);
      try {
        const res = await fetch("/health", { signal: ctrl.signal });
        clearTimeout(t);
        return res.ok;
      } catch (e) {
        clearTimeout(t);
        return false;
      }
    }

    async function loadInfo() {
      try {
        const res = await fetch("/call/info");
        const data = await res.json();
        const num = data.helpline || "";
        const el = document.getElementById("helplineNum");
        const link = document.getElementById("helplineLink");
        if (num) {
          el.textContent = num;
          link.href = "tel:" + num.replace(/[^\d+]/g, "");
          link.style.pointerEvents = "auto";
          setIn("Tap Call Saathi voice agent — your phone dials the helpline.", "");
        } else {
          el.textContent = "Helpline not configured";
          link.removeAttribute("href");
          setIn("Set TWILIO_PHONE_NUMBER (or Exotel virtual number) on the server.", "bad");
        }
      } catch (e) {
        setIn("Could not load helpline number.", "bad");
      }
    }

    (async function boot() {
      serverEl.textContent = "Waking server…";
      const ok = await pingHealth(90000);
      if (ok) {
        serverEl.textContent = "Server ready.";
        serverEl.style.color = "var(--ok)";
      } else {
        serverEl.textContent = "Server not ready — wait and refresh.";
        serverEl.style.color = "var(--bad)";
      }
      await loadInfo();
    })();

    outPanel.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const language = document.getElementById("language").value;
      if (!name || !phone) {
        setOut("Name and phone are required.", "bad");
        return;
      }
      callBtn.disabled = true;
      setOut("Checking server…", "");
      if (!(await pingHealth(90000))) {
        setOut("Server still waking — refresh and try again.", "bad");
        callBtn.disabled = false;
        return;
      }
      setOut("Calling…", "");
      try {
        const res = await fetch("/call/outbound", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, to_number: phone, language }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setOut(data.error || data.message || ("Failed (" + res.status + ")"), "bad");
          endBtn.disabled = true;
          activeCallSid = null;
        } else {
          activeCallSid = data.call_sid || null;
          endBtn.disabled = !activeCallSid;
          const who = (data.user && data.user.name) || name;
          setOut(
            activeCallSid
              ? ("Ringing " + who + " — use End call to hang up.")
              : ("Ringing " + who + "…"),
            "ok"
          );
        }
      } catch (err) {
        setOut("Network error — refresh and retry.", "bad");
      } finally {
        callBtn.disabled = false;
      }
    });

    endBtn.addEventListener("click", async () => {
      if (!activeCallSid) {
        setOut("No active call to end.", "bad");
        return;
      }
      endBtn.disabled = true;
      setOut("Ending call…", "");
      try {
        const res = await fetch("/call/hangup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ call_sid: activeCallSid }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setOut(data.error || "Could not end call", "bad");
          endBtn.disabled = false;
          return;
        }
        activeCallSid = null;
        setOut("Call ended.", "ok");
      } catch (e) {
        setOut("Network error ending call.", "bad");
        endBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
